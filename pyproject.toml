[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-risk-scorer"
version = "0.1.0"
description = "Score the risk of a git change by what it touches, how big it is and when it ships, with reasons."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = ["PyYAML>=6", "tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/narayana006/change-risk-scorer"

[project.scripts]
change-risk-scorer = "change_risk_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
