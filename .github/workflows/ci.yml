name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Run the quick start from the README
        run: |
          bash examples/make-demo-repo.sh "$RUNNER_TEMP/risk-demo"
          change-risk-scorer --repo "$RUNNER_TEMP/risk-demo" --base main --head feature \
            --config examples/change-risk.yml --now 2026-11-27T16:30

  action:
    # Runs the composite action from this checkout against the latest commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: risk
        uses: ./
      - name: Check the action outputs
        env:
          SCORE: ${{ steps.risk.outputs.score }}
          LEVEL: ${{ steps.risk.outputs.level }}
          REPORT: ${{ steps.risk.outputs.report }}
        run: |
          echo "score=$SCORE level=$LEVEL"
          [[ "$SCORE" =~ ^[0-9]+$ ]]
          [[ "$LEVEL" =~ ^(low|medium|high|critical)$ ]]
          grep -q "^## Change risk:" "$REPORT"
